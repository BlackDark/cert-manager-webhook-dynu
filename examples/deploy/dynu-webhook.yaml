apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.ukmetrics.ca
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
