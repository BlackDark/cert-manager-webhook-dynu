    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/inject-ca-from: "cert-manager/dynu-webhook-webhook-tls"
spec:
  group: acme.ukmetrics.ca
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: dynu-webhook
    namespace: cert-manager
  version: v1alpha1

---
# Source: dynu-webhook/templates/pki.yaml
# Generate a CA Certificate used to sign certificates for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dynu-webhook-ca
  namespace: "cert-manager"
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
    app.kubernetes.io/name: dynu-webhook
    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: dynu-webhook-ca
  duration: 43800h # 5y
  issuerRef:
    name: dynu-webhook-selfsign
  commonName: "ca.dynu-webhook.cert-manager"
  isCA: true
---
# Source: dynu-webhook/templates/pki.yaml
# Finally, generate a serving certificate for the webhook to use
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dynu-webhook-webhook-tls
  namespace: "cert-manager"
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
    app.kubernetes.io/name: dynu-webhook
    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  secretName: dynu-webhook-webhook-tls
  duration: 8760h # 1y
  issuerRef:
    name: dynu-webhook-ca
  dnsNames:
  - dynu-webhook
  - dynu-webhook.cert-manager
  - dynu-webhook.cert-manager.svc

---
# Source: dynu-webhook/templates/pki.yaml
# Create a selfsigned Issuer, in order to create a root CA certificate for
# signing webhook serving certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dynu-webhook-selfsign
  namespace: "cert-manager"
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
    app.kubernetes.io/name: dynu-webhook
    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  selfSigned: {}
---
# Source: dynu-webhook/templates/pki.yaml
# Create an Issuer that uses the above generated CA certificate to issue certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dynu-webhook-ca
  namespace: "cert-manager"
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
    app.kubernetes.io/name: dynu-webhook
    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  ca:
    secretName: dynu-webhook-ca
