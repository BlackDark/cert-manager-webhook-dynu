---
# Source: dynu-webhook/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynu-webhook
  labels:
    app: dynu-webhook
    release: dynu-webhook
    chart: dynu-webhook-0.0.1
    heritage: Helm
    helm.sh/chart: dynu-webhook-0.0.1
    app.kubernetes.io/name: dynu-webhook
    app.kubernetes.io/instance: dynu-webhook
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynu-webhook
      release: dynu-webhook
  template:
    metadata:
      labels:
        app: dynu-webhook
        release: dynu-webhook
        chart: dynu-webhook-0.0.1
        heritage: Helm
        helm.sh/chart: dynu-webhook-0.0.1
        app.kubernetes.io/name: dynu-webhook
        app.kubernetes.io/instance: dynu-webhook
        app.kubernetes.io/version: "0.0.1"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: dynu-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dynu-webhook
          image: "ghcr.io/blackdark/cert-manager-webhook-dynu:v0.0.1"
          imagePullPolicy: IfNotPresent
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: "acme.ukmetrics.ca"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
      volumes:
        - name: certs
          secret:
            secretName: dynu-webhook-webhook-tls

