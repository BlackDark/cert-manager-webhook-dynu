apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dynu-webhook.fullname" . }}
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dynu-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:auth-delegator
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dynu-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:domain-solver
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:domain-solver
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dynu-webhook.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
# Role to access dynu-webhook secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:secret-reader
  namespace: {{ .Values.certManager.namespace }}
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - 'secrets'
{{- if .Values.secretsNames }}
    resourceNames:
{{ toYaml .Values.secretsNames | indent 6 }}
{{- else }}
    # WARNING: secretsNames is empty — this role grants GET access to ALL secrets
    # in namespace {{ .Values.certManager.namespace }}. Set secretsNames in values.yaml
    # to restrict access to only the required secret(s).
{{- end }}
    verbs:
      - 'get'
# Allow dynu-webhook ServiceAccount to read its secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dynu-webhook.fullname" . }}:secret-reader
  namespace: {{ .Values.certManager.namespace }}
  labels:
{{ include "dynu-webhook.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dynu-webhook.fullname" . }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dynu-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
