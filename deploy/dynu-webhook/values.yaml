# The GroupName here is used to identify your company or business unit that
# created this webhook.
# For example, this may be "acme.mycompany.com".
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: acme.ukmetrics.ca

replicaCount: 1

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

# List of secret names this webhook is allowed to read in certManager.namespace.
# SECURITY: Leaving this empty grants access to ALL secrets in that namespace.
# Best practice: specify the name of your Dynu API token secret here, e.g.:
#   secretsNames:
#     - dynu-api-token
secretsNames: []

image:
  repository: ghcr.io/blackdark/cert-manager-webhook-dynu
  tag: v0.0.1@sha256:ab050b7dbad2a347502e8653af8b007d93db98522a0750d1a1d205078100bd12
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
