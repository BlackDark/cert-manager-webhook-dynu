name: release-helm-chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (required when running manually)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: deploy/dynu-webhook

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Normalize repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Resolve chart version
        id: version
        shell: bash
        env:
          CHART_VERSION_INPUT: ${{ github.event.inputs.chart_version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$CHART_VERSION_INPUT"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Unable to resolve chart version. Provide workflow_dispatch input 'chart_version'."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        id: package
        shell: bash
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .chart-packages
          helm package "$CHART_DIR" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            --destination .chart-packages
          CHART_PACKAGE="$(ls .chart-packages/*.tgz | head -n 1)"
          echo "path=$CHART_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | \
            helm registry login ghcr.io \
              --username "$GH_ACTOR" \
              --password-stdin

      - name: Push chart to GHCR
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.path }}
        run: helm push "$CHART_PACKAGE" "oci://ghcr.io/${OWNER_LC}/charts"
